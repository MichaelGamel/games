# Netlify deploy config for the Vite single-page app.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: serve index.html for any path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Always revalidate the service worker so a new deploy is picked up promptly
# (this is what makes the in-app "new version available" prompt fire).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Serve the web manifest with the correct MIME type.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
