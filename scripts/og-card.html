<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: 'Fredoka', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 56px 68px;
        background:
          radial-gradient(130% 130% at 80% 8%, #7c3aed 0%, #5b21b6 40%, #3b0764 74%, #270552 100%);
        overflow: hidden;
      }

      /* soft decorative glows */
      .card::before {
        content: '';
        position: absolute;
        width: 520px; height: 520px;
        right: -120px; top: -160px;
        background: radial-gradient(circle, rgba(168,85,247,.55), transparent 62%);
        filter: blur(8px);
      }
      .card::after {
        content: '';
        position: absolute;
        width: 420px; height: 420px;
        left: 40%; bottom: -220px;
        background: radial-gradient(circle, rgba(59,130,246,.28), transparent 64%);
      }

      /* ---- left: board product shot ---- */
      .board-frame {
        position: relative;
        flex: 0 0 auto;
        width: 452px;
        height: 452px;
        border-radius: 30px;
        overflow: hidden;
        box-shadow:
          0 30px 70px rgba(0,0,0,.5),
          0 0 0 1px rgba(255,255,255,.14) inset;
        background: #1b0640;
        transform: rotate(-2deg);
      }
      .board-img {
        position: absolute;
        inset: 0;
        background-image: url('/hostA.png');
        background-repeat: no-repeat;
        background-size: 318% auto;
        background-position: 3.5% 19%;
      }

      /* ---- right: copy ---- */
      .copy {
        position: relative;
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        gap: 22px;
        color: #fff;
      }

      .brandline {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brandline img { width: 46px; height: 46px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.4)); }
      .brandline .kicker {
        font-weight: 600;
        font-size: 22px;
        letter-spacing: .26em;
        text-transform: uppercase;
        color: rgba(255,255,255,.72);
      }

      h1 {
        font-weight: 700;
        font-size: 92px;
        line-height: .94;
        letter-spacing: -0.01em;
        text-shadow: 0 6px 30px rgba(0,0,0,.35);
      }
      h1 .amp { color: #fbbf24; }
      h1 .emoji { -webkit-text-fill-color: initial; }

      .tagline {
        font-weight: 500;
        font-size: 30px;
        line-height: 1.3;
        color: rgba(255,255,255,.9);
        max-width: 560px;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 6px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 11px 20px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 23px;
        color: #fff;
        background: rgba(255,255,255,.12);
        border: 1px solid rgba(255,255,255,.2);
        backdrop-filter: blur(2px);
      }

      .domain {
        margin-top: 8px;
        font-weight: 500;
        font-size: 22px;
        color: rgba(255,255,255,.62);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="board-frame">
        <div class="board-img"></div>
      </div>

      <div class="copy">
        <div class="brandline">
          <img src="/public/favicon.svg" alt="" />
          <span class="kicker">Robin Games</span>
        </div>

        <h1>
          <span class="emoji">🐍</span> Snakes <span class="amp">&amp;</span><br />
          Ladders <span class="emoji">🪜</span>
        </h1>

        <p class="tagline">
          Roll the dice, climb the ladders, dodge the snakes — race your friends to 100.
        </p>

        <div class="chips">
          <span class="chip">🎲 2–4 players</span>
          <span class="chip">🤝 Pass &amp; play</span>
          <span class="chip">🌐 Online multiplayer</span>
        </div>

        <div class="domain">robin-games.netlify.app</div>
      </div>
    </div>
  </body>
</html>
