<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: 'Fredoka', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        display: flex;
        align-items: center;
        gap: 44px;
        padding: 52px 72px 52px 60px;
        background:
          radial-gradient(125% 130% at 78% 6%, #7c3aed 0%, #5b21b6 42%, #3b0764 74%, #270552 100%);
        overflow: hidden;
      }

      /* soft decorative glows */
      .card::before {
        content: '';
        position: absolute;
        width: 560px; height: 560px;
        right: -150px; top: -190px;
        background: radial-gradient(circle, rgba(168,85,247,.55), transparent 62%);
        filter: blur(8px);
      }
      .card::after {
        content: '';
        position: absolute;
        width: 460px; height: 460px;
        left: 30%; bottom: -250px;
        background: radial-gradient(circle, rgba(59,130,246,.30), transparent 64%);
      }

      /* ---- left: Robin photo stage ---- */
      .stage {
        position: relative;
        flex: 0 0 auto;
        width: 470px;
        height: 526px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .stage .decor { position: absolute; inset: 0; z-index: 1; }

      /* soft spotlight behind the portrait */
      .stage::before {
        content: '';
        position: absolute;
        width: 446px; height: 446px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,.18), rgba(255,255,255,0) 66%);
      }

      .portrait {
        position: relative;
        z-index: 2;
        width: 414px;
        height: 414px;
        border-radius: 50%;
        background-color: #c9d2bd;            /* fallback if the source photo is missing */
        background-image: url('robin-source.jpeg');   /* build-only, see scripts/README.md */
        background-repeat: no-repeat;
        background-size: 116%;
        background-position: 50% 26%;
        box-shadow:
          0 26px 64px rgba(0,0,0,.5),
          0 0 0 10px rgba(255,255,255,.96),
          0 0 0 19px rgba(168,85,247,.5);
      }
      /* warm rim glow ring */
      .portrait::after {
        content: '';
        position: absolute;
        inset: -34px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(251,191,36,0) 58%, rgba(251,191,36,.24) 73%, rgba(251,191,36,0) 82%);
        z-index: -1;
      }

      /* ---- right: copy ---- */
      .copy {
        position: relative;
        z-index: 3;
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
        color: #fff;
      }

      .brandline {
        display: flex;
        align-items: center;
        gap: 13px;
      }
      .brandline .kicker {
        font-weight: 600;
        font-size: 20px;
        letter-spacing: .26em;
        text-transform: uppercase;
        color: rgba(255,255,255,.74);
      }

      h1 {
        font-weight: 700;
        font-size: 104px;
        line-height: .9;
        letter-spacing: -0.015em;
        text-shadow: 0 6px 30px rgba(0,0,0,.35);
      }
      h1 .accent { color: #fbbf24; }

      .tagline {
        font-weight: 500;
        font-size: 27px;
        line-height: 1.32;
        color: rgba(255,255,255,.9);
        max-width: 540px;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 13px;
        margin-top: 4px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 11px 20px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 22px;
        color: #fff;
        background: rgba(255,255,255,.12);
        border: 1px solid rgba(255,255,255,.2);
      }

      .domain {
        margin-top: 6px;
        font-weight: 500;
        font-size: 21px;
        color: rgba(255,255,255,.62);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- ============ LEFT: Robin's real photo + floating game pieces ============ -->
      <div class="stage">
        <div class="portrait"></div>

        <!-- floating game pieces around the portrait -->
        <svg class="decor" viewBox="0 0 470 526" xmlns="http://www.w3.org/2000/svg">
          <!-- ludo pawns along the base -->
          <g>
            <g transform="translate(122 478)">
              <ellipse cx="0" cy="44" rx="20" ry="6" fill="#000" opacity=".25"/>
              <path d="M-15,40 Q-15,18 -8,12 A12 12 0 1 1 8,12 Q15,18 15,40 Z" fill="#ef4444"/>
              <ellipse cx="0" cy="40" rx="17" ry="6" fill="#b91c1c"/>
            </g>
            <g transform="translate(236 486) scale(1.05)">
              <ellipse cx="0" cy="44" rx="20" ry="6" fill="#000" opacity=".25"/>
              <path d="M-15,40 Q-15,18 -8,12 A12 12 0 1 1 8,12 Q15,18 15,40 Z" fill="#3b82f6"/>
              <ellipse cx="0" cy="40" rx="17" ry="6" fill="#2563eb"/>
            </g>
            <g transform="translate(346 478) scale(.92)">
              <ellipse cx="0" cy="44" rx="20" ry="6" fill="#000" opacity=".25"/>
              <path d="M-15,40 Q-15,18 -8,12 A12 12 0 1 1 8,12 Q15,18 15,40 Z" fill="#10b981"/>
              <ellipse cx="0" cy="40" rx="17" ry="6" fill="#059669"/>
            </g>
          </g>
          <!-- small floating die, top-left -->
          <g transform="rotate(-16 60 50)">
            <rect x="36" y="28" width="50" height="50" rx="13" fill="#fff"/>
            <circle cx="51" cy="43" r="4.6" fill="#5b21b6"/>
            <circle cx="71" cy="63" r="4.6" fill="#5b21b6"/>
            <circle cx="61" cy="53" r="4.6" fill="#5b21b6"/>
          </g>
          <!-- mini ladder, top-right -->
          <g transform="rotate(18 402 70)" stroke="#f4b16a" stroke-width="6" stroke-linecap="round">
            <line x1="392" y1="36" x2="408" y2="118"/>
            <line x1="416" y1="32" x2="432" y2="114"/>
            <line x1="398" y1="54" x2="422" y2="50"/>
            <line x1="402" y1="76" x2="426" y2="72"/>
            <line x1="406" y1="98" x2="430" y2="94"/>
          </g>
          <!-- sparkles -->
          <g fill="#fde68a">
            <path d="M150 30 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 Z" opacity=".9"/>
            <path d="M360 470 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z" opacity=".85"/>
            <path d="M22 300 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z" opacity=".75"/>
          </g>
        </svg>
      </div>

      <!-- ============ RIGHT: copy ============ -->
      <div class="copy">
        <div class="brandline">
          <svg width="42" height="42" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#a855f7"/>
                <stop offset="100%" stop-color="#6d28d9"/>
              </linearGradient>
            </defs>
            <path d="M27 2 L9 26 h11 l-5 20 22 -28 h-12 l8 -16 Z" fill="url(#bolt)"
                  stroke="#c4b5fd" stroke-width="1.4" stroke-linejoin="round"/>
          </svg>
          <span class="kicker">Game night, anytime</span>
        </div>

        <h1>Robin's<br /><span class="accent">Games</span></h1>

        <p class="tagline">
          Snakes &amp; Ladders, Ludo &amp; more — roll, race and beat your
          friends. Pass-and-play on one screen or online in real time.
        </p>

        <div class="chips">
          <span class="chip">🐍 Snakes &amp; Ladders</span>
          <span class="chip">🎲 Ludo</span>
          <span class="chip">🌐 Play online</span>
        </div>

        <div class="domain">robin-games.netlify.app</div>
      </div>
    </div>
  </body>
</html>
